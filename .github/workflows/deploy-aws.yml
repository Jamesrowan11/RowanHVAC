name: Deploy to Linux server (SSH)

# Push-to-deploy for an AWS EC2 / Lightsail (or any Linux) host running the
# portal under PM2 + nginx. OPT-IN: only runs when the SSH secrets are set, so
# it's a harmless no-op until you configure them. Add under
# Settings → Secrets and variables → Actions:
#
#   SSH_HOST   the server's public IP or hostname
#   SSH_USER   the SSH user (e.g. ubuntu)
#   SSH_KEY    the PRIVATE SSH key authorized on the server (full PEM contents)
#   SSH_PORT   optional, defaults to 22

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_KEY}" ]; then
            echo "SSH secrets not configured — skipping deploy (no-op)."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            'bash /var/www/rowanhvac-app/deploy/deploy.sh'
