name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rowan
          POSTGRES_PASSWORD: rowan
          POSTGRES_DB: rowanhvac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rowan:rowan@localhost:5432/rowanhvac?schema=public
      AUTH_SECRET: ci-secret-not-for-production-0123456789abcdef
      EMAIL_FROM: "Rowan Heating & Air Conditioning <info@rowanhvac.com>"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
