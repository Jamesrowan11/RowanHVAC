name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rowanhvac
          MYSQL_USER: rowan
          MYSQL_PASSWORD: rowan
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: mysql://rowan:rowan@127.0.0.1:3306/rowanhvac
      AUTH_SECRET: ci-secret-not-for-production-0123456789abcdef
      EMAIL_FROM: "Rowan Heating & Air Conditioning <info@rowanheatingandair.com>"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---- Website + portal (one Node app) ----
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Build website + portal
        run: npm run build

      # ---- Van terminal desktop app ----
      - name: Van app tests + Python 3.4 compatibility check
        working-directory: van-app
        run: |
          python3 -m unittest discover -s tests -v
          pip install vermin
          vermin -t=3.4- --no-tips --violations rowanvan RowanVan.pyw
