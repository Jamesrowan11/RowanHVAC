# nginx config for Rowan HVAC on a single Linux server (AWS EC2 / Lightsail).
# Copy to /etc/nginx/sites-available/rowanhvac.conf and symlink into
# sites-enabled, then run certbot to add HTTPS (it edits these blocks for you):
#
#   sudo ln -s /etc/nginx/sites-available/rowanhvac.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rowanhvac.rowancopy.com -d rowanhvacportal.rowancopy.com

# ---- Portal (Node app behind a reverse proxy) ----
server {
    listen 80;
    server_name rowanhvacportal.rowancopy.com;

    # Allow document uploads up to ~12MB.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- Public marketing site (static files) ----
server {
    listen 80;
    server_name rowanhvac.rowancopy.com;

    root /var/www/rowanhvac-public;
    index index.html;

    # Static export uses trailing-slash directories; fall back gracefully.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
