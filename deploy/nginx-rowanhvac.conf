# nginx config for Rowan HVAC on a plain Linux server (no Plesk), e.g. AWS.
# The website, customer/staff portal and van API are ONE Node app on ONE
# domain. Copy to /etc/nginx/sites-available/rowanhvac.conf, symlink into
# sites-enabled, then add HTTPS with certbot (it edits this block for you):
#
#   sudo ln -s /etc/nginx/sites-available/rowanhvac.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rowanheatingandair.com -d www.rowanheatingandair.com

# www → bare domain
server {
    listen 80;
    server_name www.rowanheatingandair.com;
    return 301 https://rowanheatingandair.com$request_uri;
}

server {
    listen 80;
    server_name rowanheatingandair.com;

    # Equipment manuals can be up to 50 MB.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
