# nginx on each app droplet, behind the DigitalOcean Load Balancer.
# The load balancer terminates HTTPS (Let's Encrypt) and forwards plain HTTP
# to port 80 here; nginx hands it to the Node app on 127.0.0.1:3000.
# Installed by setup-droplet.sh as /etc/nginx/sites-available/rowanhvac.conf.

# Keep the original scheme the load balancer saw (https), for sign-in cookies.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # The load balancer reaches droplets over private IPv4.
    listen 80 default_server;
    server_name _;

    # Equipment manuals can be up to 50 MB.
    client_max_body_size 60m;

    # www → bare domain
    if ($host = www.rowanheatingandair.com) {
        return 301 https://rowanheatingandair.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
