# Plesk: Websites & Domains → <portal domain> → Apache & nginx Settings →
# turn OFF "Proxy mode", then paste this into "Additional nginx directives".
# (`location ~ ^/` instead of `location /` avoids clashing with Plesk's own.)

# Equipment manuals can be up to 50 MB.
client_max_body_size 60m;

location ~ ^/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
}
